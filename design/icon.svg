<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2148"/>
      <stop offset="1" stop-color="#245A9E"/>
    </linearGradient>
  </defs>

  <rect width="108" height="108" fill="url(#bg)"/>

  <!-- 书本封面：中间的钥匙孔是挖空（even-odd），会透出背景 -->
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M38,27 h32 a5,5 0 0 1 5,5 v44 a5,5 0 0 1 -5,5 h-32 a5,5 0 0 1 -5,-5 v-44 a5,5 0 0 1 5,-5 z
           M54,44.6 a5.0,5.0 0 1 0 0.01 0 z
           M51.6,53.4 h4.8 l0.9,12.6 h-6.6 z"/>

  <!-- 书脊：胶囊形状，深蓝薄纱 -->
  <path fill="#0E2148" opacity="0.22"
        d="M39.5,30.25 a3.25,3.25 0 0 1 -6.5,0 v47.5 a3.25,3.25 0 0 1 6.5,0 z"/>

  <!-- 书签丝带 -->
  <path fill="#3FD0D4" d="M64,27 h7 v17.5 l-3.5,-3 l-3.5,3 z"/>
</svg>
